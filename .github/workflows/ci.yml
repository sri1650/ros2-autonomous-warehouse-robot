name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff pyyaml
      - run: ruff check src/warehouse_robot_mission src/warehouse_robot_diagnostics
      - run: pytest -q tests/unit

  ros-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >-
            warehouse_robot_interfaces
            warehouse_robot_description
            warehouse_robot_navigation
            warehouse_robot_safety
            warehouse_robot_mission
            warehouse_robot_diagnostics
            warehouse_robot_bringup
          target-ros2-distro: jazzy
          skip-tests: false
          colcon-defaults: |
            {
              "build": {"cmake-args": ["-DCMAKE_BUILD_TYPE=RelWithDebInfo"]},
              "test": {"event-handlers": ["console_direct+"]}
            }
